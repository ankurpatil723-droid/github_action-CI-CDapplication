name: CICD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  code:
    uses: ./.github/workflows/code.yml

  build:
    needs: code
    uses: ./.github/workflows/build.yml

  test:
    needs: build
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
